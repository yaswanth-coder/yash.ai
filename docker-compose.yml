version: "3.9"

services:

  frontend:
    build: ./apps/frontend
    ports:
      - "3000:3000"

  backend:
    build: ./apps/backend
    ports:
      - "8000:8000"

  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: yash
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

  redis:
    image: redis:7

  chromadb:
    image: chromadb/chroma